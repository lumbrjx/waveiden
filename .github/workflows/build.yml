name: Build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ libsndfile1-dev libportaudio2 portaudio19-dev libncursesw5-dev pkg-config

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: |
          mkdir -p dist
          tar -C build -czf dist/waveiden-linux-x86_64.tar.gz waveiden
          sha256sum dist/waveiden-linux-x86_64.tar.gz > dist/waveiden-linux-x86_64.tar.gz.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: waveiden-linux-x86_64
          path: dist/

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/waveiden-linux-x86_64.tar.gz dist/waveiden-linux-x86_64.tar.gz.sha256 --generate-notes
